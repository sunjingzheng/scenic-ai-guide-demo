      <stop offset=".5" stop-color="#5f9d68"/>
      <stop offset="1" stop-color="#2e7057"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7eed7"/>
      <stop offset="1" stop-color="#bda985"/>
