  <title id="title">灵山胜境俯瞰导览图</title>
  <desc id="desc">依据灵山胜境结构化资料绘制的俯瞰式导览底图，展示入口、中轴线、香水海、梵宫、五印坛城、九龙灌浴、祥符禅寺和灵山大佛。</desc>
